<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 300" preserveAspectRatio="none" role="img" aria-label="footer">

  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#6F55E0"/>
      <stop offset="0.45" stop-color="#9B85F7"/>
      <stop offset="0.8" stop-color="#C39CF2"/>
      <stop offset="1" stop-color="#E3A6EE"/>
    </linearGradient>
    <linearGradient id="glassA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.6" stop-color="#9F86F5" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#C9B6FF" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="glassB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B72F2" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#E29CF0" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="b1"><stop offset="0" stop-color="#5B3FD6"/><stop offset="1" stop-color="#5B3FD6" stop-opacity="0"/></radialGradient>
    <radialGradient id="b2"><stop offset="0" stop-color="#F3B4F7"/><stop offset="1" stop-color="#F3B4F7" stop-opacity="0"/></radialGradient>
    <radialGradient id="b3"><stop offset="0" stop-color="#8AA0FF"/><stop offset="1" stop-color="#8AA0FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="b4"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>

    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="lift" x="-10%" y="-40%" width="120%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#3B1F8F" flood-opacity="0.35"/>
    </filter>

    <clipPath id="bodyClip">
      <path d="M0 0 L0 205 Q300 265 600 225 T1200 240 L1200 0 Z">
        <animate attributeName="d" dur="20s" repeatCount="indefinite" calcMode="spline"
          keyTimes="0;0.333;0.667;1" keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1"
          values="M0 0 L0 205 Q300 265 600 225 T1200 240 L1200 0 Z;
                  M0 0 L0 235 Q300 200 600 240 T1200 215 L1200 0 Z;
                  M0 0 L0 250 Q300 215 600 250 T1200 225 L1200 0 Z;
                  M0 0 L0 205 Q300 265 600 225 T1200 240 L1200 0 Z"/>
      </path>
    </clipPath>
  </defs>
  <g transform="translate(0 300) scale(1 -1)">

  <path fill="url(#glassA)" d="M0 0 L0 250 Q300 300 600 262 T1200 280 L1200 0 Z">
    <animate attributeName="d" dur="20s" begin="-10s" repeatCount="indefinite" calcMode="spline"
      keyTimes="0;0.333;0.667;1" keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1"
      values="M0 0 L0 250 Q300 300 600 262 T1200 280 L1200 0 Z;
              M0 0 L0 272 Q300 240 600 285 T1200 255 L1200 0 Z;
              M0 0 L0 258 Q300 292 600 266 T1200 292 L1200 0 Z;
              M0 0 L0 250 Q300 300 600 262 T1200 280 L1200 0 Z"/>
  </path>
  <path fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.2" d="M0 250 Q300 300 600 262 T1200 280">
    <animate attributeName="d" dur="20s" begin="-10s" repeatCount="indefinite" calcMode="spline"
      keyTimes="0;0.333;0.667;1" keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1"
      values="M0 250 Q300 300 600 262 T1200 280;
              M0 272 Q300 240 600 285 T1200 255;
              M0 258 Q300 292 600 266 T1200 292;
              M0 250 Q300 300 600 262 T1200 280"/>
  </path>

  <path fill="url(#glassB)" d="M0 0 L0 236 Q300 210 600 252 T1200 228 L1200 0 Z">
    <animate attributeName="d" dur="16s" begin="-4s" repeatCount="indefinite" calcMode="spline"
      keyTimes="0;0.333;0.667;1" keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1"
      values="M0 0 L0 236 Q300 210 600 252 T1200 228 L1200 0 Z;
              M0 0 L0 258 Q300 285 600 240 T1200 262 L1200 0 Z;
              M0 0 L0 228 Q300 268 600 236 T1200 258 L1200 0 Z;
              M0 0 L0 236 Q300 210 600 252 T1200 228 L1200 0 Z"/>
  </path>
  <path fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1" d="M0 236 Q300 210 600 252 T1200 228">
    <animate attributeName="d" dur="16s" begin="-4s" repeatCount="indefinite" calcMode="spline"
      keyTimes="0;0.333;0.667;1" keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1"
      values="M0 236 Q300 210 600 252 T1200 228;
              M0 258 Q300 285 600 240 T1200 262;
              M0 228 Q300 268 600 236 T1200 258;
              M0 236 Q300 210 600 252 T1200 228"/>
  </path>

  <g clip-path="url(#bodyClip)">
    <rect width="1200" height="300" fill="url(#body)" opacity="0.94"/>
    <g filter="url(#blur)">
      <circle cx="180" cy="60" r="210" fill="url(#b1)" opacity="0.8">
        <animateTransform attributeName="transform" type="translate" values="0 0; 160 40; 60 -10; 0 0" dur="22s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1040" cy="200" r="230" fill="url(#b2)" opacity="0.85">
        <animateTransform attributeName="transform" type="translate" values="0 0; -180 -40; -70 20; 0 0" dur="26s" repeatCount="indefinite"/>
      </circle>
      <circle cx="620" cy="260" r="200" fill="url(#b3)" opacity="0.7">
        <animateTransform attributeName="transform" type="translate" values="0 0; 120 -60; -140 -20; 0 0" dur="24s" repeatCount="indefinite"/>
      </circle>
      <ellipse cx="600" cy="0" rx="520" ry="120" fill="url(#b4)"/>
    </g>
    <rect x="-500" y="-20" width="260" height="340" fill="url(#shine)" transform="skewX(-22)">
      <animate attributeName="x" values="-500; 1500; 1500" keyTimes="0; 0.38; 1" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <path fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="1.6" d="M0 205 Q300 265 600 225 T1200 240">
    <animate attributeName="d" dur="20s" repeatCount="indefinite" calcMode="spline"
      keyTimes="0;0.333;0.667;1" keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1"
      values="M0 205 Q300 265 600 225 T1200 240;
              M0 235 Q300 200 600 240 T1200 215;
              M0 250 Q300 215 600 250 T1200 225;
              M0 205 Q300 265 600 225 T1200 240"/>
  </path>
  </g>
</svg>
